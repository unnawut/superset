# Sentinel verification gate.
#
# Superset's own 49 CI workflows were removed from this demonstration copy:
# they need secrets and infrastructure this repo does not have, so they would
# fail on every pull request and produce no signal.
#
# This replaces them with checks that are fast, deterministic, and enforce the
# invariant the remediation pipeline actually cares about: a fix must not make
# the safety net smaller. It also gives the pipeline's CI-failure-feedback path
# a real check_suite event to react to.
name: sentinel-verify

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quarantine-guard:
    name: no newly disabled tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if this PR disables any test
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          # Added lines only. A remediation PR is allowed to REMOVE a skip;
          # adding one is how an agent could "pass" by shrinking coverage.
          added=$(git diff "$base"...HEAD -- '*.py' \
            | grep -E '^\+[^+]' \
            | grep -E '@(pytest\.mark\.(skip|skipif|xfail)|unittest\.skip)' \
            || true)

          if [ -n "$added" ]; then
            echo "::error::This pull request disables one or more tests."
            echo "$added"
            echo ""
            echo "Remediation must fix the underlying defect, not silence the test."
            exit 1
          fi
          echo "No tests were disabled."

      - name: Fail if assertions were deleted wholesale
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          removed=$(git diff "$base"...HEAD -- 'tests/*.py' \
            | grep -cE '^-[^-].*\bassert\b' || true)
          added=$(git diff "$base"...HEAD -- 'tests/*.py' \
            | grep -cE '^\+[^+].*\bassert\b' || true)
          echo "assertions removed=$removed added=$added"
          if [ "$removed" -gt 0 ] && [ "$added" -eq 0 ]; then
            echo "::error::Assertions were removed and none added back."
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ruff
      - name: Lint only the files this PR touched
        # Linting the whole tree fails on violations that predate the change,
        # which is precisely the noise Superset's own workflows were removed to
        # avoid. A remediation PR must be judged on what it changed.
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}"...HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "Linting: $files"
          ruff check $files --output-format=github
